<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sửa sản phẩm</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100">
    <nav class="bg-blue-600 text-white shadow">
      <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
        <strong>WEB2064 JSNC</strong>
        <a href="index.html" class="hover:text-gray-200">Quay lại danh sách</a>
      </div>
    </nav>

    <div class="max-w-xl mx-auto mt-10 bg-white rounded-lg shadow p-6">
      <h1 class="text-2xl font-semibold mb-6 text-center">Sửa sản phẩm</h1>

      <form id="product-form" class="space-y-4">
        <div>
          <label class="block mb-1 font-medium">Mã sản phẩm</label>
          <input id="product-id" type="text" class="w-full border border-gray-300 rounded px-3 py-2 bg-gray-100" readonly />
        </div>

        <div>
          <label for="name" class="block mb-1 font-medium">Tên sản phẩm</label>
          <input id="name" type="text" class="w-full border border-gray-300 rounded px-3 py-2" placeholder="Nhập tên sản phẩm" required />
        </div>

        <div>
          <label for="price" class="block mb-1 font-medium">Giá</label>
          <input id="price" type="number" min="0" class="w-full border border-gray-300 rounded px-3 py-2" placeholder="Nhập giá" required />
        </div>

        <div>
          <label for="category" class="block mb-1 font-medium">Danh mục</label>
          <input id="category" type="text" class="w-full border border-gray-300 rounded px-3 py-2" placeholder="Nhập danh mục" required />
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded font-medium">
          Cập nhật sản phẩm
        </button>
      </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.7/axios.min.js"></script>
    <script src="lab5.js"></script>
  </body>
</html>
